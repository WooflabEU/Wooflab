name: Feature request
description: Suggest a useful improvement to WoofLab.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who would benefit and what they are trying to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches you considered
